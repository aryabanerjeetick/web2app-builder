name: Free APK build queue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: web2app-apk-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.issue.pull_request && contains(github.event.issue.body, '<!-- WEB2APP_BUILD_REQUEST -->') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out builder code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate request and apply free queue limit
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REQUEST_FILE: ${{ runner.temp }}/web2app-issue-${{ github.event.issue.number }}.json
        run: node scripts/github-issue-build.mjs prepare

      - name: Set up Java 17
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Set up Android SDK
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install required Android SDK packages
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        id: build
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        env:
          REQUEST_FILE: ${{ runner.temp }}/web2app-issue-${{ github.event.issue.number }}.json
          APK_PATH: ${{ runner.temp }}/web2app-${{ github.event.issue.number }}.apk
          DATA_DIR: ${{ runner.temp }}/web2app-build-data
          BUILDER_API_URL: http://127.0.0.1:3000
        run: |
          set -Eeuo pipefail
          node server.js > "$RUNNER_TEMP/web2app-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/api/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/web2app-server.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/web2app-server.log"
            exit 1
          fi
          node scripts/github-issue-build.mjs build

      - name: Upload APK for one day
        id: upload
        if: ${{ steps.prepare.outputs.ready == 'true' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web2app-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/web2app-${{ github.event.issue.number }}.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Post the build result to the issue
        if: ${{ always() && steps.prepare.outputs.ready == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUEST_READY: ${{ steps.prepare.outputs.ready }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: node scripts/github-issue-build.mjs complete
