plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.web2app.container"
    compileSdk 36

    defaultConfig {
        applicationId "__APPLICATION_ID__"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "START_URL_BASE64", "\"__START_URL_BASE64__\""
        buildConfigField "boolean", "POST_NOTIFICATIONS_ENABLED", "__POST_NOTIFICATIONS_ENABLED__"
        buildConfigField "String", "POSTS_FEED_BASE64", "\"__POSTS_FEED_BASE64__\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.work:work-runtime-ktx:2.11.2"
}
