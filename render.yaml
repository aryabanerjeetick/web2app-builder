services:
  - type: web
    name: web2app-builder-aryabanerjeetick
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /data
      - key: CORS_ORIGINS
        value: https://aryabanerjeetick.github.io
      - key: MAX_CONCURRENT_BUILDS
        value: "1"
      - key: MAX_QUEUE_SIZE
        value: "4"
      - key: TRUST_PROXY
        value: "1"
